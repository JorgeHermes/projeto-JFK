<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Login – JFK Pacotes Turísticos</title>
</head>
<body>

    <header>
        <h1><a href="index.html" style="color:white;text-decoration:none;">JFK</a></h1>
    </header>

    <main class="form-main">
        <div class="form-container">
            <h2>Entrar na sua conta</h2>
            <p class="form-subtitulo">Faça login para continuar sua compra</p>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="••••••••">
            </div>

            <a href="pagamento.html"><button class="btn-comprar" style="width:100%;margin-top:10px;">Entrar</button></a>

            <div class="form-divider">
                <span>Ainda não tem conta?</span>
            </div>

            <a href="cadastro.html"><button class="btn-secundario" style="width:100%;">Criar conta</button></a>

            <p style="text-align:center;margin-top:15px;"><a href="index.html" class="link-voltar">← Voltar ao início</a></p>
        </div>
    </main>

    <footer>
        <p>Site criado por <a href="https://github.com/JorgeHermes">Hermes</a>.</p>
    </footer>
</body>
</html>
