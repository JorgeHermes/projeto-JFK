<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>JFK Pacotes Turísticos</title>
</head>

<body>

    <header>
        <h1>JFK</h1>
        <div class="banner">
            <div class="slides">
                <img src="img-header.jpg">
                <img src="img-header2.jpg">
                <img src="img-header3.png">
            </div>
        </div>
    </header>

    <main>
        <h2>Veja todos os nossos pacotes disponíveis:</h2>

        <section>
            <div class="grid">

                <div class="card">
                    <img src="https://images.unsplash.com/photo-1516483638261-f4dbaf036963?w=300&h=200&fit=crop" alt="Toscana, Itália">
                    <h3>Toscana, Itália</h3>
                    <p>7 dias de paisagens encantadoras</p>
                    <span class="preco">R$ 8.990</span>
                    <a href="pacote-toscana.html"><button class="btnDetalha">Detalhes</button></a>
                </div>

                <div class="card">
                    <img src="https://images.unsplash.com/photo-1538136524612-45b74f9f3e1d?w=300&h=200&fit=crop" alt="Cancún, México">
                    <h3>Cancún, México</h3>
                    <p>8 dias de praias paradisíacas</p>
                    <span class="preco">R$ 6.490</span>
                    <a href="pacote-cancun.html"><button class="btnDetalha">Detalhes</button></a>
                </div>

                <div class="card">
                    <img src="https://images.unsplash.com/photo-1492571350019-22de08371fd3?w=300&h=200&fit=crop" alt="Tóquio, Japão">
                    <h3>Tóquio, Japão</h3>
                    <p>10 dias na terra do sol nascente</p>
                    <span class="preco">R$ 14.200</span>
                    <a href="pacote-toquio.html"><button class="btnDetalha">Detalhes</button></a>
                </div>

                <div class="card">
                    <img src="https://images.unsplash.com/photo-1533929736458-ca588d08c8be?w=300&h=200&fit=crop" alt="Paris, França">
                    <h3>Paris, França</h3>
                    <p>6 dias na cidade luz</p>
                    <span class="preco">R$ 9.750</span>
                    <a href="pacote-paris.html"><button class="btnDetalha">Detalhes</button></a>
                </div>

            </div>
        </section>
    </main>

    <footer>
        <p>Site criado por <a href="https://github.com/JorgeHermes">Hermes</a>.</p>
    </footer>
</body>
</html>
