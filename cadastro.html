<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Cadastro – JFK Pacotes Turísticos</title>
</head>
<body>

    <header>
        <h1><a href="index.html" style="color:white;text-decoration:none;">JFK</a></h1>
    </header>

    <main class="form-main">
        <div class="form-container">
            <h2>Criar conta</h2>
            <p class="form-subtitulo">Preencha seus dados para se cadastrar</p>

            <div class="form-row">
                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Seu nome">
                </div>
                <div class="form-group">
                    <label for="sobrenome">Sobrenome</label>
                    <input type="text" id="sobrenome" placeholder="Seu sobrenome">
                </div>
            </div>

            <div class="form-group">
                <label for="email-cad">E-mail</label>
                <input type="email" id="email-cad" placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00">
            </div>

            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" placeholder="(00) 00000-0000">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="senha-cad">Senha</label>
                    <input type="password" id="senha-cad" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label for="confirmar-senha">Confirmar senha</label>
                    <input type="password" id="confirmar-senha" placeholder="••••••••">
                </div>
            </div>

            <a href="pagamento.html"><button class="btn-comprar" style="width:100%;margin-top:10px;">Salvar e continuar</button></a>

            <p style="text-align:center;margin-top:15px;"><a href="login.html" class="link-voltar">← Voltar ao login</a></p>
        </div>
    </main>

    <footer>
        <p>Site criado por <a href="https://github.com/JorgeHermes">Hermes</a>.</p>
    </footer>
</body>
</html>
